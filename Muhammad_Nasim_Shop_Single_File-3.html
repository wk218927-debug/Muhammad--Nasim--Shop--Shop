<!doctype html>
<html lang="ps" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ورکشاپ ماشین سازی محمد نسیم</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#17202a}
header{background:#111827;color:white;padding:18px;text-align:center}
main{max-width:900px;margin:auto;padding:16px}
.card{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}
input,button,textarea{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border:1px solid #ccd3da;border-radius:9px}
button{background:#111827;color:white;border:0;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.product img{width:100%;height:170px;object-fit:cover;border-radius:10px;background:#eee}
.price{font-size:20px;font-weight:bold}
.small{color:#667085;font-size:13px}
#admin{display:none}
</style>
</head>
<body>
<header>
<h1>ورکشاپ ماشین سازی محمد نسیم</h1>
<div>د ماشینونو، پرزو او خدماتو پلورنځی</div>
</header>
<main>
<div class="card">
<h2>محصولات</h2>
<input id="search" placeholder="د ماشین یا پرزې نوم ولټوه..." oninput="render()">
</div>
<div id="products" class="grid"></div>

<div class="card">
<h2>🔐 د مدیر برخه</h2>
<p class="small">دا نسخه د اسانه ازموینې لپاره ده. د ټولو موبایلونو ګډ Online Database د Firebase/Supabase حساب ته اړتیا لري.</p>
<input id="adminPass" type="password" placeholder="د مدیر رمز">
<button onclick="login()">ننوتل</button>
</div>

<section id="admin" class="card">
<h2>➕ نوی محصول</h2>
<input id="name" placeholder="د محصول نوم">
<input id="price" placeholder="قیمت">
<input id="stock" placeholder="موجودي">
<input id="image" placeholder="د عکس URL (اختیاري)">
<textarea id="desc" placeholder="تشریح"></textarea>
<button onclick="addProduct()">محصول اضافه کړه</button>
<div id="adminList"></div>
</section>
</main>
<script>
const KEY='nasim_products_v1';
let products=JSON.parse(localStorage.getItem(KEY)||'[]');
function save(){localStorage.setItem(KEY,JSON.stringify(products))}
function render(){
 const q=(document.getElementById('search').value||'').toLowerCase();
 const box=document.getElementById('products');
 const arr=products.filter(p=>(p.name+p.desc).toLowerCase().includes(q));
 box.innerHTML=arr.length?arr.map(p=>`<div class="card product">
 ${p.image?`<img src="${esc(p.image)}" alt="">`:''}
 <h3>${esc(p.name)}</h3><div class="price">${esc(p.price)} افغانۍ</div>
 <div>موجودي: ${esc(p.stock)}</div><p>${esc(p.desc)}</p>
 </div>`).join(''):'<div class="card">تر اوسه محصول نه دی اضافه شوی.</div>';
 renderAdmin();
}
function login(){
 if(document.getElementById('adminPass').value==='2468') document.getElementById('admin').style.display='block';
 else alert('رمز ناسم دی');
}
function addProduct(){
 const p={name:name.value.trim(),price:price.value.trim(),stock:stock.value.trim(),image:image.value.trim(),desc:desc.value.trim()};
 if(!p.name){alert('د محصول نوم ولیکه');return}
 products.unshift(p);save();
 name.value=price.value=stock.value=image.value=desc.value='';
 render();alert('محصول اضافه شو');
}
function del(i){products.splice(i,1);save();render()}
function renderAdmin(){
 const box=document.getElementById('adminList'); if(!box)return;
 box.innerHTML=products.map((p,i)=>`<div class="card"><b>${esc(p.name)}</b> — ${esc(p.price)} افغانۍ <button onclick="del(${i})">حذف</button></div>`).join('');
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
render();
</script>
</body>
</html>
